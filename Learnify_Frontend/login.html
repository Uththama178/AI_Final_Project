<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Learnify</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #F6FAFD 0%, #B3CFE5 100%);
            padding: 20px;
        }
        .auth-card {
            background: var(--cls-white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(10, 25, 49, 0.1);
            width: 100%;
            max-width: 450px;
        }
        .auth-card h2 {
            margin-bottom: 10px;
            color: var(--cls-dark-navy);
            text-align: center;
        }
        .auth-card p {
            text-align: center;
            color: rgba(10, 25, 49, 0.6);
            margin-bottom: 30px;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }
        .message-box {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            text-align: center;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div class="auth-container">
        <div class="auth-card">
            <h2>Welcome Back</h2>
            <p>Sign in to your Learnify account</p>

            <div id="messageBox" class="message-box"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="email" placeholder="Enter your registered email" required class="form-input">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" placeholder="Enter your password" required class="form-input">
                </div>
                <button type="submit" class="btn-primary" style="width: 100%; justify-content: center; margin-top: 10px;">
                    Sign In <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>
            <p style="margin-top: 20px; margin-bottom: 0;">Don't have an account? <a href="signup.html" style="color: var(--cls-deep-blue); font-weight: 600; text-decoration: none;">Register</a></p>
        </div>
    </div>

   <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const msgBox = document.getElementById('messageBox');
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const loginData = {
                Email: email,
                Password: password
            };

            try {
                const response = await fetch('http://127.0.0.1:8000/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(loginData)
                });

                const data = await response.json();

                if (response.ok) {
                    msgBox.className = "message-box success";
                    msgBox.innerText = "Login Successful!";
                    msgBox.style.display = "block";

                    // 🌟 1. ඩෑෂ්බෝඩ් එකට අවශ්‍ය ඔක්කොම ඩේටා ටික බ්‍රවුසර් එකේ නිවැරදි Keys වලින් සේව් කරගන්නවා
                    localStorage.setItem('access_token', data.access_token);
                    localStorage.setItem('user_name', data.user_name);
                    localStorage.setItem('user_email', data.user_email);
                    localStorage.setItem('user_role', data.user_role);

                    alert("Logged in successfully! Redirecting...");

                    // 🌟 2. යූසර්ගේ Role එක අනුව නිවැරදිම ඩෑෂ්බෝඩ් එකට හරවා යැවීම
                    const role = data.user_role.toLowerCase();
                    if (role === "teacher" || role === "both") {
                        window.location.href = "teacher_dashboard.html";
                    } else if (role === "student") {
                        window.location.href = "student_dashboard.html"; 
                    }
                } else {
                    msgBox.className = "message-box error";
                    msgBox.innerText = data.detail || "Invalid email or password!";
                    msgBox.style.display = "block";
                }
            } catch (error) {
                msgBox.className = "message-box error";
                msgBox.innerText = "Cannot connect to Backend Server!";
                msgBox.style.display = "block";
            }
        });
    </script>
</body>
</html>
