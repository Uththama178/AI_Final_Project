<!-- Learnify Teacher Course Cards — Modal & Template Fragments (loaded dynamically) -->

<!-- Course Edit Modal (Title / Description / Price ONLY) -->
<div id="tc-edit-course-modal" class="tc-modal-overlay" aria-hidden="true">
    <div class="tc-modal" role="dialog" aria-labelledby="tc-edit-modal-title">
        <div class="tc-modal-header">
            <h3 id="tc-edit-modal-title"><i class="fa-solid fa-pen-to-square"></i> Edit Course Info</h3>
            <button type="button" class="tc-modal-close" data-tc-close="edit" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <form id="tc-edit-course-form">
            <div class="tc-modal-body">
                <p class="tc-locked-hint">
                    <i class="fa-solid fa-lock"></i>
                    Chapters, videos, PDFs, and quizzes stay locked. Only basic info can be changed.
                </p>
                <input type="hidden" id="tc-edit-course-id" value="">
                <div class="tc-form-group">
                    <label for="tc-edit-title">Course Title</label>
                    <input type="text" id="tc-edit-title" name="Title" required maxlength="150" placeholder="Enter course title">
                </div>
                <div class="tc-form-group">
                    <label for="tc-edit-description">Description</label>
                    <textarea id="tc-edit-description" name="Description" rows="4" placeholder="Enter course description"></textarea>
                </div>
                <div class="tc-form-group">
                    <label for="tc-edit-price">Price (LKR)</label>
                    <input type="number" id="tc-edit-price" name="Price" min="0" step="0.01" required placeholder="0.00">
                </div>
            </div>
            <div class="tc-modal-footer">
                <button type="button" class="tc-btn tc-btn-secondary" data-tc-close="edit">Cancel</button>
                <button type="submit" class="tc-btn tc-btn-primary" id="tc-edit-save-btn">
                    <i class="fa-solid fa-floppy-disk"></i> Save Changes
                </button>
            </div>
        </form>
    </div>
</div>

<!-- Video Player Modal (z-index above full-page course/quiz overlays) -->
<div id="tc-video-modal" class="tc-modal-overlay" style="z-index: 10050;" aria-hidden="true">
    <div class="tc-modal tc-modal-wide" role="dialog" aria-labelledby="tc-video-modal-title">
        <div class="tc-modal-header">
            <h3 id="tc-video-modal-title"><i class="fa-solid fa-circle-play"></i> Lecture Preview</h3>
            <button type="button" class="tc-modal-close" data-tc-close="video" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <div class="tc-modal-body">
            <div class="tc-video-frame-wrap" id="tc-video-player-container">
                <iframe
                    id="tc-youtube-iframe"
                    title="Lecture video"
                    src=""
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                    allowfullscreen
                    referrerpolicy="strict-origin-when-cross-origin"
                ></iframe>
            </div>
            <p id="tc-video-error" class="tc-details-error" hidden style="margin-top:12px;"></p>
        </div>
    </div>
</div>

<!-- Full-Page Course Details Overlay -->
<div id="tc-course-view-overlay" class="tc-fullpage-overlay" aria-hidden="true">
    <div class="tc-fullpage-shell" role="dialog" aria-modal="true" aria-labelledby="tc-course-view-title">
        <header class="tc-fullpage-header">
            <div class="tc-fullpage-header-left">
                <button type="button" class="tc-btn tc-btn-nav" id="tc-course-view-close" data-tc-close="course-view">
                    <i class="fa-solid fa-arrow-left"></i> Back to My Courses
                </button>
            </div>
            <div class="tc-fullpage-header-meta">
                <span class="tc-fullpage-badge" id="tc-course-view-price">LKR 0.00</span>
                <span class="tc-fullpage-badge tc-fullpage-badge-soft" id="tc-course-view-chapters">0 Chapters</span>
            </div>
        </header>
        <div class="tc-fullpage-hero">
            <p class="tc-fullpage-kicker">Course Details</p>
            <h2 id="tc-course-view-title">Course Title</h2>
            <p id="tc-course-view-description" class="tc-fullpage-description">Description</p>
        </div>
        <div class="tc-fullpage-content">
            <h3 class="tc-fullpage-section-title"><i class="fa-solid fa-book-open"></i> Chapters &amp; Modules</h3>
            <div id="tc-course-view-chapters-list" class="tc-course-chapters-list">
                <p class="tc-details-loading">Loading chapters...</p>
            </div>
        </div>
    </div>
</div>

<!-- Dedicated Full-Page Chapter Quiz View -->
<div id="tc-quiz-view-overlay" class="tc-fullpage-overlay tc-quiz-fullpage" aria-hidden="true">
    <div class="tc-fullpage-shell" role="dialog" aria-modal="true" aria-labelledby="tc-quiz-view-title">
        <header class="tc-fullpage-header">
            <div class="tc-fullpage-header-left">
                <button type="button" class="tc-btn tc-btn-nav" id="tc-quiz-view-back" data-tc-close="quiz-view">
                    <i class="fa-solid fa-arrow-left"></i> Back to Course
                </button>
            </div>
            <div class="tc-fullpage-header-meta">
                <span class="tc-fullpage-badge tc-fullpage-badge-soft" id="tc-quiz-view-progress">0 / 0</span>
            </div>
        </header>
        <div class="tc-fullpage-hero tc-quiz-hero">
            <p class="tc-fullpage-kicker" id="tc-quiz-view-chapter-label">Chapter Quiz</p>
            <h2 id="tc-quiz-view-title">Quiz Title</h2>
            <div class="tc-quiz-progress-track">
                <div class="tc-quiz-progress-fill" id="tc-quiz-progress-fill" style="width: 0%;"></div>
            </div>
        </div>
        <div class="tc-fullpage-content">
            <div id="tc-quiz-view-questions" class="tc-quiz-page-questions">
                <p class="tc-details-loading">Loading quiz...</p>
            </div>
        </div>
    </div>
</div>

<!-- Hidden reusable templates (cloned by my_courses_render.js) -->
<template id="tc-course-card-template">
    <article class="tc-course-card" data-course-id="">
        <div class="tc-course-card-accent"></div>
        <div class="tc-course-card-body">
            <div class="tc-course-card-top">
                <span class="tc-chapter-count">
                    <i class="fa-solid fa-layer-group"></i>
                    <span class="tc-chapter-count-value">0 Chapters</span>
                </span>
                <span class="tc-price-badge">LKR 0.00</span>
            </div>
            <h4 class="tc-course-title">Course Title</h4>
            <p class="tc-course-desc">No description provided.</p>
            <div class="tc-card-actions">
                <button type="button" class="tc-btn tc-btn-secondary tc-btn-edit-info">
                    <i class="fa-solid fa-pen"></i> Edit Info
                </button>
                <button type="button" class="tc-btn tc-btn-primary tc-btn-view-details">
                    <i class="fa-solid fa-arrow-up-right-from-square"></i> View Details
                </button>
                <button type="button" class="tc-btn tc-btn-danger tc-btn-delete-course">
                    <i class="fa-solid fa-trash"></i> Delete
                </button>
            </div>
        </div>
    </article>
</template>

<template id="tc-chapter-accordion-template">
    <div class="tc-chapter-accordion" data-chapter-id="">
        <button type="button" class="tc-chapter-header">
            <span class="tc-chapter-header-left">
                <span class="tc-chapter-num">1</span>
                <span class="tc-chapter-title">Chapter Title</span>
            </span>
            <i class="fa-solid fa-chevron-down tc-chapter-chevron"></i>
        </button>
        <div class="tc-chapter-body">
            <div class="tc-media-row tc-chapter-actions-grid"></div>
        </div>
    </div>
</template>
